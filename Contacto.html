<main class="container my-5">

    <h1 class="text-center mb-4">Página de Contacto</h1>

    <section class="mb-5">
        <h2>Formulario de contacto</h2>

        <!-- FORMULARIO SIN FUNCIONALIDAD -->
        <form>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="apellidos" placeholder="Ingresa tus apellidos">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="genero" class="form-label">Género</label>
                    <select class="form-select" id="genero">
                        <option selected disabled>Selecciona una opción</option>
                        <option>Hombre</option>
                        <option>Mujer</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" placeholder="Número telefónico">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="motivo" class="form-label">Motivo de contacto</label>
                    <input type="text" class="form-control" id="motivo" placeholder="Escribe el motivo">
                </div>
            </div>

            <div class="mb-3">
                <button type="submit" class="btn btn-primary">Enviar</button>
            </div>

        </form>
    </section>

</main>

<footer class="bg-light text-center py-3">
    <p>Iván Guadalupe Torres Vargas</p>
